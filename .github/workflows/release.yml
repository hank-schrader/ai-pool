name: release

# Push a tag like v0.1.0 to build and publish installable archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: "", archive: tar.gz }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, exe: ".exe", archive: zip }
          - { os: macos-14, target: aarch64-apple-darwin, exe: "", archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build pool-server and pool-miner
        run: cargo build --release --locked -p pool-server -p pool-miner

      # CPU-only, from the pinned llama.cpp commit; counts Clef tokens without a GPU.
      - name: Build clef-token-count
        shell: bash
        run: |
          cmake -S native/clef-token-count -B build/clef-token-count -DCMAKE_BUILD_TYPE=Release
          cmake --build build/clef-token-count --config Release --target clef-token-count --parallel

      - name: Package
        shell: bash
        run: |
          name="ai-pool-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name/config"
          cp "target/release/pool-server${{ matrix.exe }}" "target/release/pool-miner${{ matrix.exe }}" "dist/$name/"
          helper=$(find build/clef-token-count -name "clef-token-count${{ matrix.exe }}" -type f | head -1)
          cp "$helper" "dist/$name/"
          cp config/models.json "dist/$name/config/"
          cp .env.example README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then 7z a "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
