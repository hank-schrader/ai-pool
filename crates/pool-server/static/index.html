<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-pool · live status</title>
<style>
/* Roles from the dataviz reference palette; dark steps are selected, not flipped. */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --border: rgba(11,11,11,0.10);
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --series-1: #2a78d6; --series-1-wash: rgba(42,120,214,0.10); --deemph: #c3c2b7;
  --good: #0ca30c; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --border: rgba(255,255,255,0.10);
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --series-1: #3987e5; --series-1-wash: rgba(57,135,229,0.12); --deemph: #52514e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --border: rgba(255,255,255,0.10);
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --series-1: #3987e5; --series-1-wash: rgba(57,135,229,0.12); --deemph: #52514e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 32px 24px 48px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.brand { font-weight: 650; font-size: 18px; letter-spacing: -0.01em; }
.brand span { color: var(--text-secondary); font-weight: 400; }
.spacer { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
.status svg { width: 14px; height: 14px; }
.theme { font: inherit; font-size: 13px; color: var(--text-secondary); background: none;
  border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; }
.hero { padding: 24px 28px; margin-bottom: 16px; }
.label { font-size: 13px; color: var(--text-secondary); }
.hero .value { font-size: 64px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; margin: 6px 0 4px; }
.hero .sub { font-size: 13px; color: var(--text-muted); }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 28px; }
.tile { padding: 18px 20px; display: grid; grid-template-columns: 1fr 140px; align-items: end; gap: 12px; }
.tile .value { font-size: 32px; font-weight: 600; line-height: 1.1; margin-top: 4px; }
.tile .note { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.tile svg { width: 140px; height: 40px; overflow: visible; }
.filters { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; padding: 2px; background: var(--surface-1); }
.seg button { font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 0;
  border-radius: 7px; padding: 5px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--page); color: var(--text-primary); font-weight: 600;
  box-shadow: 0 0 0 1px var(--border); }
.chart { padding: 20px 20px 12px; }
.chart h2 { font-size: 16px; font-weight: 600; margin: 0; }
.chart .subtitle { font-size: 13px; color: var(--text-muted); margin: 2px 0 12px; }
.chart-head { display: flex; align-items: baseline; gap: 12px; }
.linkish { white-space: nowrap; font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 0;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer; margin-left: auto; }
.plot { position: relative; }
.plot svg { display: block; width: 100%; height: 300px; }
.plot svg:focus { outline: 2px solid var(--series-1); outline-offset: 4px; border-radius: 6px; }
.tick { font-size: 11px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
.endlabel { font-size: 12px; fill: var(--text-primary); font-weight: 600; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  white-space: nowrap; transform: translate(-50%, -110%); }
.tooltip .v { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
.tooltip .v i { display: inline-block; width: 12px; height: 2px; background: var(--series-1); border-radius: 1px; }
.tooltip .t { color: var(--text-muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
th { color: var(--text-secondary); font-weight: 600; }
.tablewrap { max-height: 320px; overflow: auto; }
footer { margin-top: 20px; font-size: 12px; color: var(--text-muted); }
.stale { opacity: 0.55; transition: opacity .2s; }
@media (max-width: 640px) {
  .kpis { grid-template-columns: 1fr; }
  .hero .value { font-size: 52px; }
}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">ai-pool <span>· live status</span></div>
    <div class="spacer"></div>
    <div class="status" id="status" role="status"></div>
    <button class="theme" id="theme" type="button">Theme: auto</button>
  </header>

  <section class="card hero" aria-labelledby="hero-label">
    <div class="label" id="hero-label">Questions answered per second</div>
    <div class="value" id="rate">–</div>
    <div class="sub" id="rate-sub">average of the last minute</div>
  </section>

  <section class="kpis">
    <div class="card tile">
      <div><div class="label">Miners connected</div><div class="value" id="miners">–</div><div class="note">last hour</div></div>
      <svg id="spark-miners" aria-hidden="true"></svg>
    </div>
    <div class="card tile">
      <div><div class="label">Questions queued</div><div class="value" id="queued">–</div><div class="note">last hour</div></div>
      <svg id="spark-queued" aria-hidden="true"></svg>
    </div>
  </section>

  <div class="filters" role="group" aria-label="Time range">
    <div class="seg" id="range">
      <button type="button" data-min="60" aria-pressed="false">1 hour</button>
      <button type="button" data-min="360" aria-pressed="false">6 hours</button>
      <button type="button" data-min="1440" aria-pressed="true">24 hours</button>
    </div>
  </div>

  <figure class="card chart" style="margin:0">
    <div class="chart-head">
      <h2>Questions answered per second</h2>
      <button class="linkish" id="table-toggle" type="button" aria-expanded="false">Show table</button>
    </div>
    <div class="subtitle" id="chart-sub">1-minute averages · last 24 hours</div>
    <div class="plot" id="plot">
      <svg id="chart" tabindex="0" role="img" aria-label="Questions answered per second over time"></svg>
      <div class="tooltip" id="tip" hidden><div class="v"><i></i><span id="tip-v"></span></div><div class="t" id="tip-t"></div></div>
    </div>
    <div class="tablewrap" id="tablewrap" hidden>
      <table><thead><tr><th>Time</th><th class="num">Questions / s</th></tr></thead><tbody id="tbody"></tbody></table>
    </div>
  </figure>

  <footer>Totals across all miners and models. Updates every 10 seconds; history covers the last 24 hours and restarts with the pool.</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });
const fmtInt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
const compact = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });
const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit" });
let stats = null, rangeMin = 1440, hover = null;

function svg(tag, attrs, parent) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

// Per-minute points for the selected range: { t: Date, v: questions per second }.
function series(minutes) {
  const h = stats.history, end = Date.parse(h.end), n = h.answered.length;
  const from = Math.max(0, n - minutes);
  return h.answered.slice(from).map((count, i) => ({
    t: new Date(end - (n - from - 1 - i) * h.interval_seconds * 1000),
    v: count / h.interval_seconds,
  }));
}

// A clean tick step (1/2/2.5/5 x 10^k) for about four intervals, and the top tick above max.
function niceScale(max) {
  const raw = (max || 1) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  return { step, top: Math.ceil((max || 1) / step) * step };
}

function drawChart() {
  const el = $("chart"); el.replaceChildren();
  const W = el.clientWidth, H = el.clientHeight, pad = { l: 36, r: 56, t: 10, b: 26 };
  el._geom = null;
  $("tip").hidden = true;
  if (!stats) return;
  const pts = series(rangeMin);
  if (!pts.length) {
    svg("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "tick" }, el).textContent = "History will appear after the first minute.";
    return;
  }
  const { step, top: max } = niceScale(Math.max(...pts.map(p => p.v)) * 1.05);
  const x = i => pad.l + (W - pad.l - pad.r) * (pts.length === 1 ? 1 : i / (pts.length - 1));
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / max);
  // grid + y ticks (hairline, solid, recessive)
  for (let k = 0; k * step <= max + 1e-9; k++) {
    const v = k * step, yy = y(v);
    svg("line", { x1: pad.l, x2: W - pad.r, y1: yy, y2: yy, stroke: k ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }, el);
    svg("text", { x: pad.l - 8, y: yy + 4, "text-anchor": "end", class: "tick" }, el).textContent = fmt.format(v);
  }
  // x ticks: as many time labels as fit (~90px each), at most 6
  const fit = Math.max(2, Math.min(6, Math.floor((W - pad.l - pad.r) / 90)));
  const every = Math.max(1, Math.round(pts.length / fit));
  for (let i = 0; i < pts.length; i += every) {
    svg("text", { x: x(i), y: H - 6, "text-anchor": "middle", class: "tick" }, el).textContent = timeFmt.format(pts[i].t);
  }
  // area wash + 2px line
  const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  svg("path", { d: `${d}L${x(pts.length - 1)},${y(0)}L${x(0)},${y(0)}Z`, fill: "var(--series-1-wash)" }, el);
  svg("path", { d, fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, el);
  // end dot with surface ring + direct end label
  const last = pts.length - 1;
  svg("circle", { cx: x(last), cy: y(pts[last].v), r: 4, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 }, el);
  svg("text", { x: x(last) + 8, y: y(pts[last].v) + 4, class: "endlabel" }, el).textContent = fmt.format(pts[last].v);
  // crosshair
  if (hover !== null && pts[hover]) {
    const hx = x(hover);
    svg("line", { x1: hx, x2: hx, y1: pad.t, y2: H - pad.b, stroke: "var(--text-muted)", "stroke-width": 1 }, el);
    svg("circle", { cx: hx, cy: y(pts[hover].v), r: 4, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 }, el);
    const tip = $("tip"); tip.hidden = false;
    $("tip-v").textContent = `${fmt.format(pts[hover].v)} / s`;
    $("tip-t").textContent = `${timeFmt.format(pts[hover].t)} · ${fmtInt.format(pts[hover].v * stats.history.interval_seconds)} questions`;
    tip.style.left = `${hx}px`; tip.style.top = `${y(pts[hover].v)}px`;
  } else { $("tip").hidden = true; }
  el._geom = { pad, W, n: pts.length };
}

function sparkline(id, values) {
  // last hour, up to 12 points: de-emphasis line, accent end dot
  const el = $(id); el.replaceChildren();
  const pts = [], recent = values.slice(-60);
  for (let k = 0; k < recent.length; k += 5) {
    const chunk = recent.slice(k, k + 5);
    pts.push(chunk.reduce((a, b) => a + b, 0) / chunk.length);
  }
  if (!pts.length) return;
  const W = 140, H = 40, max = Math.max(...pts, 1), min = Math.min(...pts, 0);
  const x = i => 4 + (W - 8) * (pts.length === 1 ? 1 : i / (pts.length - 1)), y = v => 4 + (H - 8) * (1 - (v - min) / ((max - min) || 1));
  svg("path", { d: pts.map((v, i) => `${i ? "L" : "M"}${x(i)},${y(v)}`).join(""), fill: "none",
    stroke: "var(--deemph)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, el);
  svg("circle", { cx: x(pts.length - 1), cy: y(pts[pts.length - 1]), r: 4, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 }, el);
}

function drawTable() {
  const tbody = $("tbody"); tbody.replaceChildren();
  if (!stats) return;
  const pts = series(rangeMin), bucket = rangeMin <= 60 ? 1 : rangeMin <= 360 ? 10 : 30;
  for (let i = pts.length; i > 0; i -= bucket) {
    const chunk = pts.slice(Math.max(0, i - bucket), i);
    const tr = document.createElement("tr");
    const a = document.createElement("td"), b = document.createElement("td");
    a.textContent = timeFmt.format(chunk[0].t) + (bucket > 1 ? `–${timeFmt.format(chunk[chunk.length - 1].t)}` : "");
    b.className = "num"; b.textContent = fmt.format(chunk.reduce((s, p) => s + p.v, 0) / chunk.length);
    tr.append(a, b); tbody.appendChild(tr);
  }
}

function render() {
  if (!stats) return;
  $("rate").textContent = fmt.format(stats.answered_per_second);
  $("rate-sub").textContent = `average of the last minute · ${compact.format(stats.answered_last_24h)} answered in the last 24 hours`;
  $("miners").textContent = fmtInt.format(stats.miners);
  $("queued").textContent = fmtInt.format(stats.queued_questions);
  sparkline("spark-miners", stats.history.miners);
  sparkline("spark-queued", stats.history.queued);
  const label = rangeMin === 60 ? "last hour" : rangeMin === 360 ? "last 6 hours" : "last 24 hours";
  $("chart-sub").textContent = `1-minute averages · ${label}`;
  drawChart(); if (!$("tablewrap").hidden) drawTable();
}

function setStatus(ok) {
  const s = $("status"); s.replaceChildren();
  const icon = svg("svg", { viewBox: "0 0 14 14" });
  if (ok) {
    svg("circle", { cx: 7, cy: 7, r: 6, fill: "var(--good)" }, icon);
    svg("path", { d: "M4 7.2l2 2 4-4.4", fill: "none", stroke: "#fff", "stroke-width": 1.6, "stroke-linecap": "round", "stroke-linejoin": "round" }, icon);
  } else {
    svg("circle", { cx: 7, cy: 7, r: 6, fill: "var(--critical)" }, icon);
    svg("path", { d: "M5 5l4 4M9 5l-4 4", stroke: "#fff", "stroke-width": 1.6, "stroke-linecap": "round" }, icon);
  }
  const text = document.createElement("span");
  text.textContent = ok ? `Live · updated ${timeFmt.format(new Date(stats.updated_at))}` : "Offline · showing the last data received";
  s.append(icon, text);
}

async function refresh() {
  try {
    const response = await fetch("v1/stats", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const next = await response.json();
    const h = next.history;
    if (!Number.isFinite(Date.parse(next.updated_at)) || !Number.isFinite(Date.parse(h.end)) ||
        h.interval_seconds !== 60 || ![next.miners, next.queued_questions, next.answered_per_second, next.answered_last_24h].every(v => Number.isFinite(v) && v >= 0) ||
        ![h.answered, h.queued, h.miners].every(a => Array.isArray(a) && a.every(v => Number.isFinite(v) && v >= 0)) ||
        h.answered.length !== h.queued.length || h.answered.length !== h.miners.length) throw new Error("Invalid stats");
    stats = next;
    document.querySelector("main").classList.remove("stale");
    setStatus(true); render();
  } catch (e) {
    setStatus(false); document.querySelector("main").classList.add("stale");
  }
}

// interactions: crosshair on pointer and keyboard, range presets, table view, theme
const chart = $("chart");
function pick(clientX) {
  const g = chart._geom; if (!g) return null;
  const r = chart.getBoundingClientRect(), px = clientX - r.left;
  const i = Math.round((px - g.pad.l) / (g.W - g.pad.l - g.pad.r) * (g.n - 1));
  return Math.min(g.n - 1, Math.max(0, i));
}
chart.addEventListener("pointermove", e => { hover = pick(e.clientX); drawChart(); });
chart.addEventListener("pointerleave", () => { hover = null; drawChart(); });
chart.addEventListener("keydown", e => {
  const n = chart._geom ? chart._geom.n : 0; if (!n) return;
  const step = e.shiftKey ? 10 : 1;
  if (e.key === "ArrowLeft") hover = Math.max(0, (hover ?? n - 1) - step);
  else if (e.key === "ArrowRight") hover = Math.min(n - 1, (hover ?? n - 1) + step);
  else if (e.key === "Escape") hover = null; else return;
  e.preventDefault(); drawChart();
});
chart.addEventListener("blur", () => { hover = null; drawChart(); });
$("range").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  rangeMin = +b.dataset.min; hover = null;
  for (const x of $("range").children) x.setAttribute("aria-pressed", String(x === b));
  render();
});
$("table-toggle").addEventListener("click", () => {
  const w = $("tablewrap"), open = w.hidden; w.hidden = !open;
  $("table-toggle").setAttribute("aria-expanded", String(open));
  $("table-toggle").textContent = open ? "Hide table" : "Show table";
  if (open) drawTable();
});
const themes = ["auto", "light", "dark"]; let theme = 0;
$("theme").addEventListener("click", () => {
  theme = (theme + 1) % 3;
  if (themes[theme] === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", themes[theme]);
  $("theme").textContent = `Theme: ${themes[theme]}`; render();
});
window.addEventListener("resize", drawChart);
refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
