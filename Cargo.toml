[workspace]
resolver = "3"
members = ["crates/pool-protocol"]
default-members = ["crates/pool-protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/hank-schrader/ai-pool"

[workspace.dependencies]
pool-protocol = { path = "crates/pool-protocol" }
pool-runtime = { path = "crates/pool-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
bytes = "1"
