[workspace]
resolver = "3"
members = ["crates/pool-protocol", "crates/pool-server", "crates/pool-runtime", "crates/pool-miner"]
default-members = ["crates/pool-server"]

[workspace.package]
version = "0.1.1"
edition = "2024"
repository = "https://github.com/hank-schrader/ai-pool"

[workspace.dependencies]
pool-protocol = { path = "crates/pool-protocol" }
pool-runtime = { path = "crates/pool-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
clap = { version = "4", features = ["derive", "env"] }
tokio-util = "0.7"

# Hash verification of multi-GB weights is far too slow unoptimized.
[profile.dev.package.sha2]
opt-level = 3
